name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: |
          cd app
          pyinstaller --onefile --windowed --name DeepSeek-Meter src\app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Meter-Windows
          path: app/dist/DeepSeek-Meter.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binary
        run: |
          cd app
          pyinstaller --onefile --windowed --name DeepSeek-Meter src/app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Meter-Linux
          path: app/dist/DeepSeek-Meter

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek-Meter-Windows/DeepSeek-Meter.exe
            dist/DeepSeek-Meter-Linux/DeepSeek-Meter
          generate_release_notes: true
