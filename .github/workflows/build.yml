name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: |
          cd app
          pyinstaller --onefile --windowed --icon=src/app.ico --name DeepSeek-Meter src/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Meter-Windows
          path: app/dist/DeepSeek-Meter.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binary
        run: |
          cd app
          pyinstaller --onefile --windowed --icon=src/app.ico --name DeepSeek-Meter src/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Meter-Linux
          path: app/dist/DeepSeek-Meter

  build-rainmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Rainmeter skin
        run: zip -r DeepSeek-Meter-Rainmeter.zip rainmeter/
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Meter-Rainmeter
          path: DeepSeek-Meter-Rainmeter.zip

  release:
    needs: [build-windows, build-linux, build-rainmeter]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Meter-Rainmeter
          path: dist
      - name: Extract changelog for current version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## ' + re.escape('$TAG') + r'.*?(?=## v|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(0).strip()
          else:
              notes = '## $TAG\n\nNo changelog entry found.'
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          print('Release notes extracted for $TAG')
          "
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek-Meter-Windows/DeepSeek-Meter.exe
            dist/DeepSeek-Meter-Linux/DeepSeek-Meter
            dist/DeepSeek-Meter-Rainmeter.zip
          body_path: release_notes.md
