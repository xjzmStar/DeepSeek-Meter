[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0
Corner=3

[Metadata]
Name=DeepSeek-Meter
Description=DeepSeek balance + peak/valley desktop widget

[Variables]
Pad=15
Hour=00
Min=00
Sec=00
DateStr=
IsPeak=0
CdMin=0
CdSec=00
BalanceRaw=N/A
IsAlert=0
PhaseText=

[LuaTime]
Measure=Script
ScriptFile=#@#time.lua
UpdateDivider=1

; Balance number for color calculation
[MeasureBalNum]
Measure=Calc
Formula=#BalanceRaw#
IfBelowAction=[!SetOption MeterBal FontColor "200,50,50"]
IfAboveAction=[!SetOption MeterBal FontColor "0,180,80"]
IfEqualAction=[!SetOption MeterBal FontColor "200,180,0"]
DynamicVariables=1

; Phase color: peak=red, valley=green  
[MeasurePhaseColor]
Measure=Calc
Formula=#IsPeak#
IfEqualValue=1
IfEqualAction=[!SetOption MeterPhase FontColor "200,50,50"]
IfBelowValue=1
IfBelowAction=[!SetOption MeterPhase FontColor "0,160,80"]
DynamicVariables=1

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,280,190,8 | Fill Color 25,25,35,0 | StrokeWidth 0

[MeterTitle]
Meter=String
X=(#Pad#+5)
Y=(#Pad#)
FontFace=Microsoft YaHei
FontSize=14
FontWeight=700
FontColor=60,70,90
Text=DeepSeek Monitor
AntiAlias=1

[MeterTime]
Meter=String
X=(#Pad#+5)
Y=42
FontFace=Consolas
FontSize=30
FontWeight=700
FontColor=30,50,80
Text=#Hour#:#Min#:#Sec#
AntiAlias=1
DynamicVariables=1

[MeterSep1]
Meter=String
Text=

[MeterPhase]
Meter=String
X=(#Pad#+5)
Y=105
FontFace=Microsoft YaHei
FontSize=20
FontWeight=700
FontColor=(#IsPeak# = 1 ? 200,50,50 : 0,160,80)
Text=#PhaseText#
StringAlign=LeftCenter
AntiAlias=1
DynamicVariables=1

[MeterSep2]
Meter=String
Text=

[MeterBal]
Meter=String
X=(265-#Pad#)
Y=105
FontFace=Consolas
FontSize=25
FontWeight=700
FontColor=#BalColor#
Text=Y#BalanceRaw#
StringAlign=RightCenter
AntiAlias=1
DynamicVariables=1

[MeterAlert]
Meter=String
X=(#Pad#+5)
Y=135
FontFace=Microsoft YaHei
FontSize=9
FontColor=200,50,50
Text=LOW BALANCE!
AntiAlias=1
Hidden=(#IsAlert# = 0 ? 1 : 0)
DynamicVariables=1
